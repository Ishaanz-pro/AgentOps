[project]
name = "enterprise-agentops"
version = "0.1.0"
description = "Enterprise employee assistant built on Google ADK + Gemini with RAG, secure tool calling, evals and observability."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.13,<3",
    "google-genai>=2.20,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "faiss-cpu>=1.9",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentops = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
